services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Укажите DJANGO_SECRET_KEY в .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_USE_HTTPS: ${DJANGO_USE_HTTPS:-0}
    volumes:
      - sqlite_data:/app/data
    command: sh -c "python manage.py migrate --noinput && gunicorn blog.wsgi:application --bind 0.0.0.0:8000 --workers 2"
volumes:
  sqlite_data:
